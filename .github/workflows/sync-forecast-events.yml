name: Sync Forecast Events

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync events from spreadsheet
        env:
          FORECAST_SHEET_URL: ${{ secrets.FORECAST_SHEET_URL }}
        run: node scripts/sync-forecast-events.mjs

      - name: Commit updated forecast events
        run: |
          if git diff --quiet -- src/features/forecast/forecastEvents.ts; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/forecast/forecastEvents.ts
          git commit -m "chore(forecast): sync events from spreadsheet"
          git push
