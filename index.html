<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MKT</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/mkt-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/mkt-512x512.png" />
    <link rel="apple-touch-icon" href="/mkt-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400;1,9..144,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        let theme = 'light';
        try {
          const data = localStorage.getItem('mkt-trip-data');
          if (data) {
            const state = JSON.parse(data).state;
            if (state && state.theme) {
              theme = state.theme;
            }
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
