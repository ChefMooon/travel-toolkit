<!doctype html>
<html lang="en" class="theme-preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan shared trip costs, convert currencies, track time zones, and check destination forecasts with Travel Toolkit." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F3EA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1918" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Travel Toolkit</title>
    <script>
      (function () {
        var settingsStorageKey = 'travel-toolkit-settings-data';
        var tripStorageKey = 'travel-toolkit-trip-data';
        var root = document.documentElement;
        var preference = null;
        var legacyTheme = null;
        var theme = 'light';

        function readStoredState(storageKey) {
          try {
            var storedValue = window.localStorage.getItem(storageKey);
            return storedValue ? JSON.parse(storedValue) : null;
          } catch (error) {
            console.error('Unable to read stored theme data.', error);
            return null;
          }
        }

        var settings = readStoredState(settingsStorageKey);
        var settingsState = settings && settings.state;
        var storedPreference = settingsState && settingsState.themePreference;
        if (
          storedPreference === 'system' ||
          storedPreference === 'light' ||
          storedPreference === 'dark'
        ) {
          preference = storedPreference;
        }

        if (!preference) {
          var trip = readStoredState(tripStorageKey);
          var tripState = trip && trip.state;
          if (tripState && (tripState.theme === 'light' || tripState.theme === 'dark')) {
            legacyTheme = tripState.theme;
          }
          preference = legacyTheme || 'light';
        }

        if (preference === 'system') {
          try {
            if (typeof window.matchMedia === 'function') {
              theme = window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
            }
          } catch (error) {
            console.error('Unable to resolve the system color scheme.', error);
          }
        } else {
          theme = preference;
        }

        root.dataset.theme = theme;
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
